name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm publish

  # The GitHub Action is referenced as faelreis/codsy/action@v<major>, so that tag must
  # follow the latest stable release of each major line. Pre-releases never move it.
  move-major-tag:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Point the major tag at this release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          MAJOR_TAG="${RELEASE_TAG%%.*}"
          git tag --force "$MAJOR_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$MAJOR_TAG"
